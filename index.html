<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecureerde Overheidsfeed</title>
    <style>
        /* CSS Variabelen voor de twee modi */
        :root {
            /* Standaard Donkere Modus (Mastodon) */
            --bg-color: #191b22;
            --surface-color: #282c37;
            --text-color: #ffffff;
            --text-muted: #9baec8;
            --accent-color: #6364ff;
            --border-color: #393f4f;
        }

        :root.light-mode {
            /* Lichte Modus */
            --bg-color: #f2f3f5;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #5c626d;
            --accent-color: #5c5eff;
            --border-color: #e0e4ed;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .header-left h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Thema Knop Styling */
        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--bg-color);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        .theme-toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* De Tijdlijn Stroom */
        #timeline {
            display: flex;
            flex-direction: column;
        }

        .toot {
            background-color: var(--surface-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .toot:last-child {
            border-radius: 0 0 4px 4px;
            border-bottom: none;
        }

        /* Toot Header */
        .toot-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 4px;
            margin-right: 12px;
            background-color: var(--bg-color);
        }

        .account-info {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .display-name {
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
        }

        .display-name:hover {
            text-decoration: underline;
        }

        .username {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .timestamp {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .timestamp:hover {
            text-decoration: underline;
        }

        /* Toot Content */
        .toot-content {
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .toot-content p {
            margin: 0 0 10px 0;
        }

        .toot-content p:last-child {
            margin-bottom: 0;
        }

        .toot-content a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .toot-content a:hover {
            text-decoration: underline;
        }

        /* Media */
        .media-attachments {
            margin-top: 12px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        .media-attachments img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: cover;
        }

        /* Actieknoppen */
        .toot-actions {
            display: flex;
            margin-top: 15px;
            color: var(--text-muted);
        }

        .action-btn {
            display: flex;
            align-items: center;
            margin-right: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
        }

        .action-btn:hover {
            color: var(--accent-color);
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            margin-right: 5px;
            fill: currentColor;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            background-color: var(--surface-color);
            border-radius: 0 0 4px 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <h1>Gecureerde Overheidsfeed</h1>
            <div class="status" id="status-text">Laden...</div>
        </div>
        <button class="theme-toggle-btn" id="theme-btn" aria-label="Wissel dag/nacht modus">
            <!-- Zon-icoon (standaard getoond in donkere modus) -->
            <svg id="theme-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z"/></svg>
            <span id="theme-text">Lichte modus</span>
        </button>
    </header>

    <div id="timeline">
        <div class="loading">Berichten ophalen uit het Fediverse...</div>
    </div>
</div>

<script>
    // Thema Logica (Dag / Nacht modus)
    const themeBtn = document.getElementById('theme-btn');
    const themeText = document.getElementById('theme-text');
    const themeIcon = document.getElementById('theme-icon');
    const htmlElement = document.documentElement;

    // SVG paden voor zon en maan
    const sunPath = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z";
    const moonPath = "M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.6-.1 1.2.4 1.1 1-.1.6-.2 1.2-.2 1.8 0 5.2 4.3 9.5 9.5 9.5.6 0 1.2-.1 1.8-.2.6-.1 1.1.4 1 1-.9 4.7-5 8.2-9.8 8.2zm-7.1-10c0 3.9 3.1 7 7 7 2.4 0 4.6-1.2 5.9-3.2-1.2.2-2.4.3-3.7.3-6.3 0-11.5-5.2-11.5-11.5 0-1.3.2-2.5.5-3.7-2 1.3-3.2 3.5-3.2 5.9z";

    // Check of er al een opgeslagen voorkeur is
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        htmlElement.classList.add('light-mode');
        themeText.textContent = 'Donkere modus';
        themeIcon.querySelector('path').setAttribute('d', moonPath);
    }

    themeBtn.addEventListener('click', () => {
        htmlElement.classList.toggle('light-mode');
        
        if (htmlElement.classList.contains('light-mode')) {
            localStorage.setItem('theme', 'light');
            themeText.textContent = 'Donkere modus';
            themeIcon.querySelector('path').setAttribute('d', moonPath);
        } else {
            localStorage.setItem('theme', 'dark');
            themeText.textContent = 'Lichte modus';
            themeIcon.querySelector('path').setAttribute('d', sunPath);
        }
    });

    // Configuratielijst van de externe accounts
    const targetAccounts = [
        { instance: 'https://social.amsterdam.nl', username: 'gemeenteamsterdam' },
        { instance: 'https://social.overheid.nl', username: 'stasdigi' }
    ];

    const icons = {
        reply: `<svg viewBox="0 0 16 16"><path d="M6.5 3.5v-2L1 6.5l5.5 5v-2c3.7 0 6 2 6 2s-.7-3.5-6-4z"/></svg>`,
        boost: `<svg viewBox="0 0 16 16"><path d="M4 4.5h8v2l3-3-3-3v2H2v5h2v-3zm8 7H4v-2l-3 3 3 3v-2h10v-5h-2v3z"/></svg>`,
        favourite: `<svg viewBox="0 0 16 16"><path d="M8 11.5l-3.5 2.5 1-4.2-3.2-3 4.3-.4L8 2.5l1.4 3.9 4.3.4-3.2 3 1 4.2z"/></svg>`
    };

    async function fetchTimeline() {
        const timelineElement = document.getElementById('timeline');
        const statusElement = document.getElementById('status-text');
        let allToots = [];

        try {
            for (const account of targetAccounts) {
                const lookupUrl = `${account.instance}/api/v1/accounts/lookup?acct=${account.username}`;
                const lookupResponse = await fetch(lookupUrl);
                
                if (!lookupResponse.ok) continue;
                const accountData = await lookupResponse.json();
                const accountId = accountData.id;

                const statusesUrl = `${account.instance}/api/v1/accounts/${accountId}/statuses?limit=10&exclude_reblogs=true`;
                const statusesResponse = await fetch(statusesUrl);
                
                if (!statusesResponse.ok) continue;
                const toots = await statusesResponse.json();

                toots.forEach(toot => toot.originalInstance = account.instance);
                allToots = allToots.concat(toots);
            }

            allToots.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (allToots.length === 0) {
                timelineElement.innerHTML = `<div class="loading">Geen berichten gevonden.</div>`;
                statusElement.textContent = '0 berichten';
                return;
            }

            timelineElement.innerHTML = '';
            allToots.forEach(toot => {
                timelineElement.appendChild(createTootElement(toot));
            });

            statusElement.textContent = 'Live bijgewerkt';

        } catch (error) {
            console.error(error);
            timelineElement.innerHTML = `<div class="loading" style="color: #ff5353;">Fout bij het laden van de feed. Probeer het later opnieuw.</div>`;
            statusElement.textContent = 'Fout';
        }
    }

    function createTootElement(toot) {
        const tootDiv = document.createElement('div');
        tootDiv.className = 'toot';

        const tootDate = new Date(toot.created_at).toLocaleDateString('nl-NL', {
            day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'
        });

        let mediaHtml = '';
        if (toot.media_attachments && toot.media_attachments.length > 0) {
            const mediaItem = toot.media_attachments[0];
            
            if (mediaItem.type === 'image') {
                const imgUrl = mediaItem.preview_url || mediaItem.url;
                mediaHtml = `
                    <div class="media-attachments">
                        <img src="${imgUrl}" alt="${mediaItem.description || 'Afbeelding'}" loading="lazy" referrerpolicy="no-referrer">
                    </div>
                `;
            } else if (mediaItem.type === 'video' || mediaItem.type === 'gifv') {
                const videoUrl = mediaItem.url;
                const posterUrl = mediaItem.preview_url || '';
                const isGifv = mediaItem.type === 'gifv';

                mediaHtml = `
                    <div class="media-attachments">
                        <video 
                            src="${videoUrl}" 
                            poster="${posterUrl}" 
                            controls 
                            ${isGifv ? 'loop muted autoplay playsinline' : ''} 
                            preload="none" 
                            style="width: 100%; max-height: 400px; display: block; object-fit: cover;"
                            referrerpolicy="no-referrer">
                            Je browser ondersteunt deze video-tag niet.
                        </video>
                    </div>
                `;
            }
        }

        const instanceHost = toot.originalInstance.replace('https://', '');
        const fullHandle = `@${toot.account.acct}@${instanceHost}`;

        tootDiv.innerHTML = `
            <div class="toot-header">
                <img class="avatar" src="${toot.account.avatar}" alt="Avatar" referrerpolicy="no-referrer">
                <div class="account-info">
                    <a href="${toot.account.url}" target="_blank" class="display-name">${toot.account.display_name}</a>
                    <span class="username">${fullHandle}</span>
                </div>
                <a href="${toot.url}" target="_blank" class="timestamp" title="${new Date(toot.created_at).toLocaleString()}">${tootDate}</a>
            </div>
            <div class="toot-content">
                ${toot.content}
            </div>
            ${mediaHtml}
            <div class="toot-actions">
                <a href="${toot.url}" target="_blank" class="action-btn">${icons.reply} ${toot.replies_count || 0}</a>
                <a href="${toot.url}" target="_blank" class="action-btn">${icons.boost} ${toot.reblogs_count || 0}</a>
                <a href="${toot.url}" target="_blank" class="action-btn">${icons.favourite} ${toot.favourites_count || 0}</a>
            </div>
        `;

        return tootDiv;
    }

    window.addEventListener('DOMContentLoaded', fetchTimeline);
</script>

</body>
</html>
