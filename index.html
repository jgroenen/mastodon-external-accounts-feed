<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecureerde Overheidsfeed - NL Design System</title>

    <link rel="stylesheet" href="https://unpkg.com/@nl-design-system/theme-rijksoverheid/dist/index.css">

    <script type="module" src="https://unpkg.com/@nl-design-system/components/dist/components.js"></script>

    <style>
        /* Aanvullende lay-out structuur met NLDS Design Tokens */
        body {
            margin: 0;
            font-family: var(--nl-font-family-base, system-ui, sans-serif);
            background-color: var(--nl-color-background-page, #f3f6f8);
            color: var(--nl-color-text-default, #111111);
            display: flex;
            justify-content: center;
            padding: 0 0 40px 0;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Positionering binnen het NLDS Header component */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #timeline {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Officiële NLDS spatiëring tussen kaarten */
            margin-top: 24px;
        }

        /* Media styling binnen de officiële NLDS kaarten */
        .nl-card-media {
            margin-top: 16px;
            border-radius: var(--nl-border-radius-medium, 4px);
            overflow: hidden;
            border: 1px solid var(--nl-color-border-default);
        }
        .nl-card-media img, .nl-card-media video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 400px;
            object-fit: cover;
        }

        .loading-trigger {
            padding: 40px 20px;
            text-align: center;
        }

        /* Visueel verborgen voor WCAG screenreader ondersteuning */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <nl-header branding="rijksoverheid" role="banner">
        <div slot="logo">
            <h1 style="font-size: 1.25rem; margin: 0; font-weight: var(--nl-font-weight-bold, 700);">Gecureerde Overheidsfeed</h1>
        </div>
        
        <div slot="actions" class="header-actions">
            <nl-select id="feed-select" label="Kies lijst" hide-label style="min-width: 180px;">
                <option value="">Lijsten laden...</option>
            </nl-select>

            <nl-button id="theme-btn" variant="subtle" aria-pressed="false" icon-only>
                <svg id="theme-icon" slot="icon" viewBox="0 0 24 24" width="20" height="20"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z"/></svg>
                <span id="theme-text" class="sr-only">Wissel naar lichte modus</span>
            </nl-button>
        </div>
    </nl-header>

    <main id="timeline" aria-label="Federatieve Berichtenstroom"></main>
    
    <div id="load-more-trigger" class="loading-trigger">
        <nl-progress-indicator id="status-text" active>Initialiseren...</nl-progress-indicator>
    </div>
</div>

<script>
    // --- THEME ENGINE ---
    const themeBtn = document.getElementById('theme-btn');
    const themeText = document.getElementById('theme-text');
    const themeIcon = document.getElementById('theme-icon');
    const htmlElement = document.documentElement;
    const sunPath = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.01l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z";
    const moonPath = "M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.6-.1 1.2.4 1.1 1-.1.6-.2 1.2-.2 1.8 0 5.2 4.3 9.5 9.5 9.5.6 0 1.2-.1 1.8-.2.6-.1 1.1.4 1 1-.9 4.7-5 8.2-9.8 8.2zm-7.1-10c0 3.9 3.1 7 7 7 2.4 0 4.6-1.2 5.9-3.2-1.2.2-2.4.3-3.7.3-6.3 0-11.5-5.2-11.5-11.5 0-1.3.2-2.5.5-3.7-2 1.3-3.2 3.5-3.2 5.9z";

    if (localStorage.getItem('theme') === 'light') {
        htmlElement.classList.add('light-mode');
        themeText.textContent = 'Wissel naar donkere modus';
        themeIcon.querySelector('path').setAttribute('d', moonPath);
        themeBtn.setAttribute('aria-pressed', 'true');
    }
    themeBtn.addEventListener('click', () => {
        htmlElement.classList.toggle('light-mode');
        const isLight = htmlElement.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        themeText.textContent = isLight ? 'Wissel naar donkere modus' : 'Wissel naar lichte modus';
        themeIcon.querySelector('path').setAttribute('d', isLight ? moonPath : sunPath);
        themeBtn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
    });

    const icons = {
        reply: `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6.5 3.5v-2L1 6.5l5.5 5v-2c3.7 0 6 2 6 2s-.7-3.5-6-4z" fill="currentColor"/></svg>`,
        boost: `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4.5h8v2l3-3-3-3v2H2v5h2v-3zm8 7H4v-2l-3 3 3 3v-2h10v-5h-2v3z" fill="currentColor"/></svg>`,
        favourite: `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 11.5l-3.5 2.5 1-4.2-3.2-3 4.3-.4L8 2.5l1.4 3.9 4.3.4-3.2 3 1 4.2z" fill="currentColor"/></svg>`
    };

    // --- DASHBOARD CORE ENGINE ---
    let globalData = null;
    let sources = [];
    let postBuffer = [];
    let isFetching = false;
    const WINDOW_SIZE = 10;
    let bottomObserver = null;

    async function initDashboard() {
        const selectElement = document.getElementById('feed-select');
        const statusElement = document.getElementById('status-text');

        try {
            globalData = await fetch('accounts.json').then(res => res.json());
            
            selectElement.innerHTML = '';
            globalData.lists.forEach(list => {
                const opt = document.createElement('option');
                opt.value = list.slug;
                opt.textContent = list.name;
                selectElement.appendChild(opt);
            });

            const urlParams = new URLSearchParams(window.location.search);
            let activeSlug = urlParams.get('list');

            const validSlugExists = globalData.lists.some(l => l.slug === activeSlug);
            if (!activeSlug || !validSlugExists) {
                activeSlug = globalData.lists[0].slug;
            }

            selectElement.value = activeSlug;

            selectElement.addEventListener('change', (e) => {
                switchList(e.target.value);
            });

            await activateList(activeSlug);

            const trigger = document.getElementById('load-more-trigger');
            bottomObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isFetching && sources.some(s => s.hasMore)) {
                    loadNextWindow();
                }
            }, { rootMargin: '400px' });
            
            bottomObserver.observe(trigger);

        } catch (e) {
            console.error(e);
            document.getElementById('timeline').innerHTML = `<div class="loading-trigger" style="color:red" role="alert">Fout bij initialiseren van NLDS dashboard. Check accounts.json.</div>`;
            statusElement.textContent = 'Fout bij laden.';
            statusElement.removeAttribute('active');
        }
    }

    function switchList(slug) {
        const newUrl = `${window.location.pathname}?list=${slug}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
        activateList(slug);
    }

    async function activateList(slug) {
        const timelineElement = document.getElementById('timeline');
        const statusElement = document.getElementById('status-text');
        
        timelineElement.innerHTML = '';
        statusElement.textContent = 'Accounts verifiëren...';
        statusElement.setAttribute('active', '');
        
        postBuffer = [];
        sources = [];
        isFetching = true;

        const listConfig = globalData.lists.find(l => l.slug === slug);
        
        for (const acc of listConfig.accounts) {
            try {
                const lookupUrl = `${acc.instance}/api/v1/accounts/lookup?acct=${acc.username}`;
                const res = await fetch(lookupUrl);
                if (!res.ok) continue;
                const data = await res.json();
                
                sources.push({
                    instance: acc.instance,
                    username: acc.username,
                    displayName: data.display_name || acc.username,
                    id: data.id,
                    lowestIdSeen: null,
                    hasMore: true
                });
            } catch (err) {
                console.error(`Kon account info voor @${acc.username} niet ophalen`, err);
            }
        }

        isFetching = false;
        
        if (sources.length > 0) {
            await loadNextWindow();
        } else {
            timelineElement.innerHTML = `<div class="loading-trigger">Geen actieve overheidsaccounts gevonden in deze lijst.</div>`;
            statusElement.textContent = 'Lijst is leeg';
            statusElement.removeAttribute('active');
        }
    }

    async function loadNextWindow() {
        if (isFetching) return;
        isFetching = true;
        
        const timelineElement = document.getElementById('timeline');
        const statusElement = document.getElementById('status-text');
        statusElement.textContent = 'Nieuwe berichten sorteren...';
        statusElement.setAttribute('active', '');

        let newBatch = [];

        for (const source of sources) {
            if (!source.hasMore) continue;

            let url = `${source.instance}/api/v1/accounts/${source.id}/statuses?limit=${WINDOW_SIZE}&exclude_reblogs=true`;
            if (source.lowestIdSeen) {
                url += `&max_id=${source.lowestIdSeen}`;
            }

            try {
                const res = await fetch(url);
                if (!res.ok) { source.hasMore = false; continue; }
                const toots = await res.json();

                if (toots.length === 0) { source.hasMore = false; continue; }

                source.lowestIdSeen = toots[toots.length - 1].id;
                toots.forEach(t => {
                    t.originalInstance = source.instance;
                    t.sourceAccountName = source.displayName;
                });
                newBatch = newBatch.concat(toots);
            } catch (e) {
                console.error(`Fout bij laden van ${source.username}:`, e);
            }
        }

        let pool = postBuffer.concat(newBatch);
        pool.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        const toDisplay = pool.slice(0, WINDOW_SIZE);
        postBuffer = pool.slice(WINDOW_SIZE);

        toDisplay.forEach(toot => {
            timelineElement.appendChild(createTootElement(toot));
        });

        const stillHasMore = sources.some(s => s.hasMore) || postBuffer.length > 0;
        if (!stillHasMore) {
            statusElement.textContent = 'Einde van deze lijst bereikt.';
            statusElement.removeAttribute('active');
        } else {
            statusElement.textContent = 'Scroll voor meer berichten...';
            statusElement.removeAttribute('active');
        }

        isFetching = false;
    }

    // --- RENDEREN MET NLDS COMPONENTEN ---
    function createTootElement(toot) {
        // We maken een officieel NLDS Card component aan
        const card = document.createElement('nl-card');
        card.setAttribute('aria-label', `Bericht van ${toot.account.display_name}`);

        const tootDate = new Date(toot.created_at).toLocaleDateString('nl-NL', {
            day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'
        });

        let mediaHtml = '';
        if (toot.media_attachments && toot.media_attachments.length > 0) {
            const mediaItem = toot.media_attachments[0];
            const altText = mediaItem.description || `Afbeelding bij het bericht van ${toot.sourceAccountName}`;
            
            if (mediaItem.type === 'image') {
                mediaHtml = `<div class="nl-card-media"><img src="${mediaItem.preview_url || mediaItem.url}" alt="${altText}" loading="lazy" referrerpolicy="no-referrer"></div>`;
            } else if (mediaItem.type === 'video' || mediaItem.type === 'gifv') {
                mediaHtml = `<div class="nl-card-media"><video src="${mediaItem.url}" poster="${mediaItem.preview_url || ''}" controls ${mediaItem.type === 'gifv' ? 'loop muted autoplay playsinline' : ''} preload="none" referrerpolicy="no-referrer" aria-label="Video: ${altText}"></video></div>`;
            }
        }

        const instanceHost = toot.originalInstance.replace('https://', '');
        
        // We vullen hier de officiële slots ('header', 'content', 'footer') van <nl-card>
        card.innerHTML = `
            <div slot="header" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div style="display: flex; align-items: center;">
                    <img src="${toot.account.avatar}" alt="" referrerpolicy="no-referrer" style="width: 44px; height: 44px; border-radius: var(--nl-border-radius-small, 2px); margin-right: 12px; border: 1px solid var(--nl-color-border-default);">
                    <div style="display: flex; flex-direction: column; line-height: 1.3;">
                        <a href="${toot.account.url}" target="_blank" style="font-weight: var(--nl-font-weight-bold, 700); color: var(--nl-color-text-default); text-decoration: none;">${toot.account.display_name}</a>
                        <span style="color: var(--nl-color-text-muted); font-size: 0.85rem;">@${toot.account.acct}@${instanceHost}</span>
                    </div>
                </div>
                <a href="${toot.url}" target="_blank" style="font-size: 0.85rem; color: var(--nl-color-text-muted); text-decoration: none;" aria-label="Gepubliceerd op ${new Date(toot.created_at).toLocaleString()}">${tootDate}</a>
            </div>
            
            <div slot="content" style="font-size: var(--nl-font-size-body, 1rem); line-height: var(--nl-line-height-body, 1.5); color: var(--nl-color-text-default);">
                <div class="toot-text-wrapper">${toot.content}</div>
                ${mediaHtml}
            </div>
            
            <div slot="footer" style="display: flex; gap: 24px;">
                <nl-button variant="subtle" href="${toot.url}" target="_blank" size="small">
                    ${icons.reply} <span style="margin-left: 6px;">${toot.replies_count || 0}</span>
                    <span class="sr-only">reacties. Klik om te antwoorden via de bron.</span>
                </nl-button>
                <nl-button variant="subtle" href="${toot.url}" target="_blank" size="small">
                    ${icons.boost} <span style="margin-left: 6px;">${toot.reblogs_count || 0}</span>
                    <span class="sr-only">boosts. Klik om dit te delen via de bron.</span>
                </nl-button>
                <nl-button variant="subtle" href="${toot.url}" target="_blank" size="small">
                    ${icons.favourite} <span style="margin-left: 6px;">${toot.favourites_count || 0}</span>
                    <span class="sr-only">favorieten. Klik om te bewaren via de bron.</span>
                </nl-button>
            </div>
        `;

        // Mastodon spuugt al HTML p-tags uit, we zorgen dat linkjes binnen de tekst de NLDS accentkleur pakken
        const links = card.querySelectorAll('.toot-text-wrapper a');
        links.forEach(l => {
            l.style.color = 'var(--nl-color-text-link)';
            l.style.textDecoration = 'underline';
        });

        return card;
    }

    window.addEventListener('DOMContentLoaded', initDashboard);
</script>
</body>
</html>
