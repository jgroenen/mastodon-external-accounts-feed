<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecureerde Overheidsfeed - Dashboard</title>
    <style>
        :root {
            --bg-color: #191b22;
            --surface-color: #282c37;
            --text-color: #ffffff;
            --text-muted: #a5b7d0;
            --accent-color: #7a7bff;
            --border-color: #393f4f;
        }

        :root.light-mode {
            --bg-color: #f2f3f5;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #4a505a;
            --accent-color: #4445db;
            --border-color: #cbd2e1;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            padding: 20px 0 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: transparent;
        }

        .list-switcher {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            width: auto;
            max-width: none;
        }

        .list-switcher:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        #timeline { 
            display: flex; 
            flex-direction: column; 
            min-height: 100px;
        }

        .toot {
            background-color: var(--surface-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
        }

        .toot:last-of-type { border-radius: 0 0 4px 4px; }
        .toot-header { display: flex; align-items: center; margin-bottom: 15px; position: relative; }
        .avatar { width: 46px; height: 46px; border-radius: 4px; margin-right: 12px; }
        .account-info { display: flex; flex-direction: column; line-height: 1.3; }
        .display-name { font-weight: 700; color: var(--text-color); text-decoration: none; }
        .display-name:hover, .display-name:focus { text-decoration: underline; outline: none; }
        .username { color: var(--text-muted); font-size: 0.9rem; }
        .timestamp { position: absolute; top: 0; right: 0; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
        .timestamp:hover, .timestamp:focus { text-decoration: underline; }
        .toot-content { font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .toot-content p { margin: 0 0 10px 0; }
        .toot-content a { color: var(--accent-color); text-decoration: underline; }
        .media-attachments { margin-top: 12px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .media-attachments img { width: 100%; height: auto; display: block; max-height: 400px; object-fit: cover; }
        .toot-actions { display: flex; margin-top: 15px; color: var(--text-muted); }
        .action-btn { display: flex; align-items: center; margin-right: 30px; font-size: 0.85rem; color: var(--text-muted); cursor: default; }
        .action-btn svg { width: 18px; height: 18px; margin-right: 5px; fill: currentColor; }
        .action-btn img.action-icon { width: 18px; height: 18px; margin-right: 5px; }
        .action-btn .count:empty { display: none; }
        .media-placeholder:empty { display: none; }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .loading-trigger { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .new-posts-indicator {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .new-posts-indicator:hover {
            opacity: 0.9;
        }
        
        .action-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 5px;
        }
        
        .toot-footer {
            margin-top: 10px;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .original-post-link {
            color: var(--text-muted);
            text-decoration: none;
        }
        
        .original-post-link:hover, .original-post-link:focus {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        /* Modal styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        
        .modal[aria-hidden="false"] {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            position: relative;
            border: 1px solid var(--border-color);
        }
        
        .modal-content h2 {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }
        
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-color);
            font-weight: 600;
        }
        
        .instance-input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            font-family: inherit;
        }
        
        .instance-input:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }
        
        .open-btn {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        
        .open-btn:hover {
            opacity: 0.9;
        }
        
        .open-btn:focus-visible {
            outline: 3px solid white;
            outline-offset: 2px;
        }
        
        .modal-footer {
            margin-top: 16px;
            text-align: center;
        }
        
        .original-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        
        .original-link:hover, .original-link:focus {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }
        
        .modal-close:hover, .modal-close:focus {
            color: var(--text-color);
            outline: none;
        }
        
        .open-post-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            text-align: right;
        }
        
        .open-post-btn:hover, .open-post-btn:focus {
            color: var(--accent-color);
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header role="banner">
        <label for="feed-select" class="sr-only">Kies een tijdlijn lijst</label>
        <select id="feed-select" class="list-switcher">
            <option value="">Kies een lijst...</option>
        </select>
    </header>

    <main id="timeline" aria-label="Federatieve Berichtenstroom"></main>
    <div id="load-more-trigger" class="loading-trigger" aria-live="assertive"></div>
  
  <!-- Templates -->
  <template id="toot-template">
    <article class="toot" aria-label="Bericht van {displayName}" data-post-id="{mastodonId}">
      <div class="toot-header">
        <img class="avatar" src="{avatar}" alt="" referrerpolicy="no-referrer">
        <div class="account-info">
          <a href="{accountUrl}" target="_blank" class="display-name">{displayName}</a>
          <span class="username" aria-hidden="true">@{acct}@{host}</span>
        </div>
        <a href="{url}" target="_blank" class="timestamp" aria-label="Gepubliceerd op {fullDate}">{date}</a>
      </div>
      <div class="toot-content">{content}</div>
      <div class="media-placeholder">{mediaHtml}</div>
      <div class="toot-actions">
        <span class="action-btn" aria-label="{repliesCount} reacties">
          <img src="img/{replyIcon}.svg" alt="" class="action-icon" loading="lazy">
          <span class="count">{repliesCount}</span>
        </span>
        <span class="action-btn" aria-label="{reblogsCount} boosts">
          <img src="img/{boostIcon}.svg" alt="" class="action-icon" loading="lazy">
          <span class="count">{reblogsCount}</span>
        </span>
        <span class="action-btn" aria-label="{favouritesCount} favorieten">
          <img src="img/{favouriteIcon}.svg" alt="" class="action-icon" loading="lazy">
          <span class="count">{favouritesCount}</span>
        </span>
      </div>
      <div class="toot-footer">
        <button class="open-post-btn" 
                data-post-url="{url}" 
                data-original-username="{originalUsername}"
                data-original-instance="{originalInstance}"
                data-original-post-id="{originalPostId}"
                data-activitypub-uri="{activityPubUri}">Open post</button>
      </div>
    </article>
  </template>
</div>

<!-- Post Open Modal -->
<div id="post-modal" class="modal" aria-hidden="true" role="dialog">
  <div class="modal-content">
    <h2>Open post op jouw instance</h2>
    <form id="post-open-form" class="modal-form">
      <div class="form-group">
        <label for="user-instance">Jouw Mastodon instance:</label>
        <input type="url" id="user-instance" class="instance-input" placeholder="https://social.example.nl" required>
      </div>
      <button type="submit" class="open-btn">Open post</button>
    </form>
    <div class="modal-footer">
      <a id="original-post-link" href="#" target="_blank" class="original-link">Open originele post</a>
    </div>
    <button class="modal-close" aria-label="Sluiten">&times;</button>
  </div>
</div>

<!-- Load the application -->
<script type="module" src="js/main.js"></script>
</body>
</html>
