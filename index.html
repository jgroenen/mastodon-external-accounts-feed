<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecureerde Overheidsfeed - Dashboard</title>
    <style>
        :root {
            --bg-color: #191b22;
            --surface-color: #282c37;
            --text-color: #ffffff;
            --text-muted: #a5b7d0;
            --accent-color: #7a7bff;
            --border-color: #393f4f;
        }

        :root.light-mode {
            --bg-color: #f2f3f5;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #4a505a;
            --accent-color: #4445db;
            --border-color: #cbd2e1;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            margin-right: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .list-switcher {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
        }

        .list-switcher:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #timeline { 
            display: flex; 
            flex-direction: column; 
            min-height: 100px;
        }

        .toot {
            background-color: var(--surface-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
        }

        .toot:last-of-type { border-radius: 0 0 4px 4px; }
        .toot-header { display: flex; align-items: center; margin-bottom: 15px; position: relative; }
        .avatar { width: 46px; height: 46px; border-radius: 4px; margin-right: 12px; }
        .account-info { display: flex; flex-direction: column; line-height: 1.3; }
        .display-name { font-weight: 700; color: var(--text-color); text-decoration: none; }
        .display-name:hover, .display-name:focus { text-decoration: underline; outline: none; }
        .username { color: var(--text-muted); font-size: 0.9rem; }
        .timestamp { position: absolute; top: 0; right: 0; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
        .timestamp:hover, .timestamp:focus { text-decoration: underline; }
        .toot-content { font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .toot-content p { margin: 0 0 10px 0; }
        .toot-content a { color: var(--accent-color); text-decoration: underline; }
        .media-attachments { margin-top: 12px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .media-attachments img { width: 100%; height: auto; display: block; max-height: 400px; object-fit: cover; }
        .toot-actions { display: flex; margin-top: 15px; color: var(--text-muted); }
        .action-btn { display: flex; align-items: center; margin-right: 30px; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
        .action-btn:hover, .action-btn:focus { color: var(--accent-color); text-decoration: underline; outline: none; }
        .action-btn svg { width: 18px; height: 18px; margin-right: 5px; fill: currentColor; }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .loading-trigger { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .new-posts-indicator {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .new-posts-indicator:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <header role="banner">
        <div class="header-left">
            <h1>Gecureerde Overheidsfeed</h1>
            <label for="feed-select" class="sr-only">Kies een tijdlijn lijst</label>
            <select id="feed-select" class="list-switcher">
                <option value="">Lijsten laden...</option>
            </select>
            <div class="status" id="status-text" aria-live="polite"></div>
        </div>
    </header>

    <div id="new-posts-indicator" class="new-posts-indicator" style="display: none;" aria-live="polite">
      <span id="new-posts-count">0</span> nieuwe berichten - klik om te laden
    </div>
    
    <main id="timeline" aria-label="Federatieve Berichtenstroom"></main>
    <div id="load-more-trigger" class="loading-trigger" aria-live="assertive"></div>
  
  <!-- Templates -->
  <template id="toot-template">
    <article class="toot" aria-label="Bericht van {displayName}" data-post-id="{mastodonId}">
      <div class="toot-header">
        <img class="avatar" src="{avatar}" alt="" referrerpolicy="no-referrer">
        <div class="account-info">
          <a href="{accountUrl}" target="_blank" class="display-name">{displayName}</a>
          <span class="username" aria-hidden="true">@{acct}@{host}</span>
        </div>
        <a href="{url}" target="_blank" class="timestamp" aria-label="Gepubliceerd op {fullDate}">{date}</a>
      </div>
      <div class="toot-content">{content}</div>
      {mediaHtml}
      <div class="toot-actions">
        <a href="{url}" target="_blank" class="action-btn">
          {replyIcon} {repliesCount}
          <span class="sr-only">reacties. Reageer op de originele server.</span>
        </a>
        <a href="{url}" target="_blank" class="action-btn">
          {boostIcon} {reblogsCount}
          <span class="sr-only">boosts. Deel vanaf je eigen server.</span>
        </a>
        <a href="{url}" target="_blank" class="action-btn">
          {favouriteIcon} {favouritesCount}
          <span class="sr-only">favorieten. Bewaar dit bericht.</span>
        </a>
      </div>
    </article>
  </template>
</div>

<!-- Icons -->
<template id="icons-template">
  <svg id="icon-reply" viewBox="0 0 16 16" aria-hidden="true" style="display:none"><path d="M6.5 3.5v-2L1 6.5l5.5 5v-2c3.7 0 6 2 6 2s-.7-3.5-6-4z"/></svg>
  <svg id="icon-boost" viewBox="0 0 16 16" aria-hidden="true" style="display:none"><path d="M4 4.5h8v2l3-3-3-3v2H2v5h2v-3zm8 7H4v-2l-3 3 3 3v-2h10v-5h-2v3z"/></svg>
  <svg id="icon-favourite" viewBox="0 0 16 16" aria-hidden="true" style="display:none"><path d="M8 11.5l-3.5 2.5 1-4.2-3.2-3 4.3-.4L8 2.5l1.4 3.9 4.3.4-3.2 3 1 4.2z"/></svg>
</template>

<!-- Load the application -->
<script type="module" src="js/main.js"></script>
</body>
</html>
