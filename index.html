<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gecureerde Overheidsfeed - Dashboard</title>
    <style>
        :root {
            --bg-color: #191b22;
            --surface-color: #282c37;
            --text-color: #ffffff;
            --text-muted: #a5b7d0;
            --accent-color: #7a7bff;
            --border-color: #393f4f;
        }

        :root.light-mode {
            --bg-color: #f2f3f5;
            --surface-color: #ffffff;
            --text-color: #000000;
            --text-muted: #4a505a;
            --accent-color: #4445db;
            --border-color: #cbd2e1;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            margin-right: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .list-switcher {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
        }

        .list-switcher:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #timeline { 
            display: flex; 
            flex-direction: column; 
            min-height: 100px;
        }

        .toot {
            background-color: var(--surface-color);
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
        }

        .toot:last-of-type { border-radius: 0 0 4px 4px; }
        .toot-header { display: flex; align-items: center; margin-bottom: 15px; position: relative; }
        .avatar { width: 46px; height: 46px; border-radius: 4px; margin-right: 12px; }
        .account-info { display: flex; flex-direction: column; line-height: 1.3; }
        .display-name { font-weight: 700; color: var(--text-color); text-decoration: none; }
        .display-name:hover, .display-name:focus { text-decoration: underline; outline: none; }
        .username { color: var(--text-muted); font-size: 0.9rem; }
        .timestamp { position: absolute; top: 0; right: 0; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; }
        .timestamp:hover, .timestamp:focus { text-decoration: underline; }
        .toot-content { font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .toot-content p { margin: 0 0 10px 0; }
        .toot-content a { color: var(--accent-color); text-decoration: underline; }
        .media-attachments { margin-top: 12px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .media-attachments img { width: 100%; height: auto; display: block; max-height: 400px; object-fit: cover; }
        .toot-actions { display: flex; margin-top: 15px; color: var(--text-muted); }
        .action-btn { display: flex; align-items: center; margin-right: 30px; font-size: 0.85rem; color: var(--text-muted); cursor: default; }
        .action-btn svg { width: 18px; height: 18px; margin-right: 5px; fill: currentColor; }
        .action-btn .count:empty { display: none; }
        .media-placeholder:empty { display: none; }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .loading-trigger { padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .new-posts-indicator {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .new-posts-indicator:hover {
            opacity: 0.9;
        }
        
        .action-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin-right: 5px;
        }
        
        .toot-footer {
            margin-top: 10px;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .original-post-link {
            color: var(--text-muted);
            text-decoration: none;
        }
        
        .original-post-link:hover, .original-post-link:focus {
            color: var(--accent-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <header role="banner">
        <div class="header-left">
            <h1>Gecureerde Overheidsfeed</h1>
            <label for="feed-select" class="sr-only">Kies een tijdlijn lijst</label>
            <select id="feed-select" class="list-switcher">
                <option value="">Kies een lijst...</option>
            </select>
            <div class="status" id="status-text" aria-live="polite"></div>
        </div>
    </header>

    <main id="timeline" aria-label="Federatieve Berichtenstroom"></main>
    <div id="load-more-trigger" class="loading-trigger" aria-live="assertive"></div>
  
  <!-- Templates -->
  <template id="toot-template">
    <article class="toot" aria-label="Bericht van {displayName}" data-post-id="{mastodonId}">
      <div class="toot-header">
        <img class="avatar" src="{avatar}" alt="" referrerpolicy="no-referrer">
        <div class="account-info">
          <a href="{accountUrl}" target="_blank" class="display-name">{displayName}</a>
          <span class="username" aria-hidden="true">@{acct}@{host}</span>
        </div>
        <a href="{url}" target="_blank" class="timestamp" aria-label="Gepubliceerd op {fullDate}">{date}</a>
      </div>
      <div class="toot-content">{content}</div>
      <div class="media-placeholder">{mediaHtml}</div>
      <div class="toot-actions">
        <span class="action-btn" aria-label="{repliesCount} reacties">
          <svg class="action-icon" viewBox="0 0 19 18" aria-hidden="true"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 0 1-4.083-.98L2.25 17l1.09-3.344A4.002 4.002 0 0 1 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM4.416 14.902l-.262-1.033a4.002 4.002 0 0 1-1.08-2.563c0-1.362.653-2.595 1.854-3.44L4 7.312V5.5c0-1.328.82-2.48 2.168-2.935.572-.204 1.178-.265 1.75-.222V3.5h-1.5v.578c-.61-.134-1.205-.35-1.68-.713C4.58 1.82 3.64 1 2.5 1c-1.44 0-2.68 1.144-2.68 2.575V5.5c0 1.05.618 1.988 1.54 2.458L4.416 8.688a4.002 4.002 0 0 1-.002 2.214l.002.001zM14.688 14.902c.473-.633.894-1.395.894-2.214 0-1.362-.653-2.595-1.854-3.44L15.5 7.312V5.5c0-1.05-.618-1.988-1.54-2.458L13.16 1.988c.473.364 1.068.58 1.68.713h1.5v-.578c-.572.263-1.178.324-1.75.28V3.5h1.5v2c1.328 0 2.48.82 2.935 2.168L17.5 8.688l1.234 1.05c.284.245.46.58.46.976v.002z"/></svg>
          <span class="count">{repliesCount}</span>
        </span>
        <span class="action-btn" aria-label="{reblogsCount} boosts">
          <svg class="action-icon" viewBox="0 0 19 17" aria-hidden="true"><path fill-rule="evenodd" d="M13.258 5.25a.75.75 0 0 0-.75.75h-1.5a.75.75 0 0 0 0 1.5h1.5a.75.75 0 0 0 .75-.75zm-4.5 0a.75.75 0 0 0-.75.75h-1.5a.75.75 0 0 0 0 1.5h1.5a.75.75 0 0 0 .75-.75zm.75 4.5a.75.75 0 0 0 0-1.5h-4.5a.75.75 0 0 0 0 1.5h4.5zm-6 0a.75.75 0 0 0-.75.75v1.5c0 .414.336.75.75.75a.75.75 0 0 0 .75-.75v-1.5a.75.75 0 0 0-.75-.75zm8.25-4.5a.75.75 0 0 0-.75-.75h-1.5a.75.75 0 0 0-.75.75v1.5c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75v-1.5zm-3 0a.75.75 0 0 0-.75.75v1.5c0 .414.336.75.75.75a.75.75 0 0 0 .75-.75v-1.5a.75.75 0 0 0-.75-.75z"/></svg>
          <span class="count">{reblogsCount}</span>
        </span>
        <span class="action-btn" aria-label="{favouritesCount} favorieten">
          <svg class="action-icon" viewBox="0 0 18 17" aria-hidden="true"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 0 1 5.656 0L10 6.343l1.172-1.171a4 4 0 1 1 5.656 5.656L10 17.657l-6.828-6.829a4 4 0 0 1-5.656-5.656z"/></svg>
          <span class="count">{favouritesCount}</span>
        </span>
      </div>
      <div class="toot-footer">
        <a href="{url}" target="_blank" class="original-post-link">Ga naar originele post.</a>
      </div>
    </article>
  </template>
</div>

<!-- Load the application -->
<script type="module" src="js/main.js"></script>
</body>
</html>
